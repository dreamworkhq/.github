name: Update org profile

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Regenerate the profile from live data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-profile.mjs
      - name: Commit when the profile changed
        run: |
          git add -A profile
          if git diff --staged --quiet; then exit 0; fi
          git -c user.name="dreamwork-bot" -c user.email="bots@dreamworkhq.com" \
            commit -q -m "chore: refresh org profile"
          git push
